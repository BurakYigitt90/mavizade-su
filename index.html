<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavizade Su - Online Sipariş</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Mavizade Su Sipariş%22,
        %22short_name%22: %22Mavizade%22,
        %22start_url%22: %22./index.html%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23eff6ff%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: [
            {
                %22src%22: %22https://cdn-icons-png.flaticon.com/512/3105/3105807.png%22,
                %22sizes%22: %22192x192%22,
                %22type%22: %22image/png%22
            },
            {
                %22src%22: %22https://cdn-icons-png.flaticon.com/512/3105/3105807.png%22,
                %22sizes%22: %22512x512%22,
                %22type%22: %22image/png%22
            }
        ]
    }">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mavizade Su">
</head>
<body class="bg-blue-50 min-h-screen flex flex-col justify-between">

    <!-- Üst Başlık -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center relative">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-droplet mr-2"></i>Mavizade Su</h1>
        <p class="text-xs text-blue-100">Uğurmumcu / Kartal Su Dağıtım Hizmetleri</p>
        
        <!-- PWA Yükle Butonu -->
        <button id="installBtn" class="hidden absolute right-3 top-3.5 bg-white text-blue-600 text-xs font-bold px-3 py-1.5 rounded-xl shadow-md flex items-center space-x-1 active:scale-95 transition">
            <i class="fa-solid fa-download"></i>
            <span>Uygulamayı İndir</span>
        </button>
    </header>

    <!-- Ana İçerik -->
    <main class="p-4 max-w-md mx-auto w-full flex-grow">
        
        <!-- Sipariş Formu Kartı -->
        <div class="bg-white rounded-2xl shadow-md p-5 mb-6">
            <h2 class="text-base font-bold text-gray-800 mb-4 border-b pb-2 flex items-center justify-between">
                <span>Hızlı Su Siparişi</span>
                <i class="fa-solid fa-truck-fast text-blue-600"></i>
            </h2>
            
            <form id="orderForm" class="space-y-4">
                <!-- Telefon Numarası -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Telefon Numarası</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" id="phone" required placeholder="0532 XXX XX XX" 
                            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-gray-50">
                    </div>
                    <p class="text-[10px] text-blue-600 mt-1"><i class="fa-solid fa-circle-info mr-1"></i>Numaranızı girdiğinizde kayıtlı adresiniz otomatik olarak getirilir.</p>
                </div>

                <!-- Ad Soyad -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Ad Soyad</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="name" required placeholder="Adınız Soyadınız" 
                            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-gray-50">
                    </div>
                </div>

                <!-- Adres -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Teslimat Adresi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 pt-2.5 text-gray-400"><i class="fa-solid fa-location-dot"></i></span>
                        <textarea id="address" required rows="2" placeholder="Mahalle, Sokak, Bina No, Daire..." 
                            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-gray-50"></textarea>
                    </div>
                </div>

                <!-- Ürün Seçimi ve Adet (İleride yeni ürünler buraya kolayca eklenebilir) -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ürün Seçimi</label>
                        <select id="product" class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-gray-50">
                            <option value="19L Damacana Su">19L Damacana Su</option>
                            <option value="5L Pet Su">5L Pet Su</option>
                            <option value="1.5L / Koli Su">1.5L Koli Su</option>
                            <!-- İleride eklenebilecek örnek ürünler için yer tutucu:
                            <option value="0.5L / Koli Bardak Su">0.5L Koli Su</option> 
                            -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Adet</label>
                        <input type="number" id="quantity" value="1" min="1" max="10" 
                            class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-center bg-gray-50 font-bold">
                    </div>
                </div>

                <!-- Sipariş Notu -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Sipariş Notu (Opsiyonel)</label>
                    <input type="text" id="note" placeholder="Örn: Boş damacana verilecektir." 
                        class="w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-gray-50">
                </div>

                <!-- Gönder Butonu -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>SİPARİŞİ ONAYLA VE GÖNDER</span>
                </button>
            </form>
        </div>

        <!-- Son Sipariş Durumu Kartı -->
        <div id="statusCard" class="hidden bg-white rounded-2xl shadow-md p-4 border-l-4 border-blue-500">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Sipariş Durum Takibi</h3>
            <div class="flex justify-between items-center">
                <div>
                    <p id="statusText" class="text-sm font-bold text-gray-800">İşleniyor...</p>
                    <p id="statusTime" class="text-[11px] text-gray-400"></p>
                </div>
                <span id="statusBadge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700">Bekliyor</span>
            </div>
        </div>

    </main>

    <!-- Alt Bilgi -->
    <footer class="text-center py-4 text-xs text-gray-400">
        Mavizade Su Dağıtım Hizmetleri &copy; 2026
    </footer>

    <!-- Kod ve PWA Mantığı -->
    <script>
        // PWA Yükleme Kurulumu
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');

            installBtn.addEventListener('click', async () => {
                installBtn.classList.add('hidden');
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('Müşteri uygulaması yüklendi');
                    }
                    deferredPrompt = null;
                }
            });
        });

        const phoneInput = document.getElementById('phone');
        const nameInput = document.getElementById('name');
        const addressInput = document.getElementById('address');
        const orderForm = document.getElementById('orderForm');
        const statusCard = document.getElementById('statusCard');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');
        const statusTime = document.getElementById('statusTime');

        // Telefon numarasına göre eski kayıtları getirme
        phoneInput.addEventListener('input', (e) => {
            let phoneVal = e.target.value.trim();
            if (phoneVal.length >= 10) {
                let savedData = localStorage.getItem('mavizade_user_' + phoneVal);
                if (savedData) {
                    let user = JSON.parse(savedData);
                    nameInput.value = user.name || '';
                    addressInput.value = user.address || '';
                }
            }
        });

        // Sipariş Gönderimi
        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();

            let phone = phoneInput.value.trim();
            let name = nameInput.value.trim();
            let address = addressInput.value.trim();
            let product = document.getElementById('product').value;
            let quantity = document.getElementById('quantity'].value;
            let note = document.getElementById('note').value;

            // Kullanıcı bilgilerini hafızada sakla
            let userData = { name, address };
            localStorage.setItem('mavizade_user_' + phone, JSON.stringify(userData));

            // Sipariş paketi oluştur
            let order = {
                id: 'MS-' + Math.floor(1000 + Math.random() * 9000),
                phone,
                name,
                address,
                product: `${quantity} Adet ${product}`,
                note,
                status: 'Bekliyor',
                time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
            };

            // Siparişleri localStorage'a kaydet
            let orders = JSON.parse(localStorage.getItem('mavizade_orders') || '[]');
            orders.unshift(order);
            localStorage.setItem('mavizade_orders', JSON.stringify(orders));

            // Durum kartını güncelle (Profesyonel dilde)
            statusCard.classList.remove('hidden');
            statusText.innerText = `${order.product} - Siparişiniz alınmıştır.`;
            statusBadge.innerText = 'İşlemde';
            statusBadge.className = 'px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700';
            statusTime.innerText = order.time;

            alert('Siparişiniz başarıyla alınmıştır. Dağıtım birimimize iletildi.');
            orderForm.reset();
        });
    </script>
</body>
</html>
